<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Prominent, crisp bold white circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" />
  
  <!-- Bold white clock hands -->
  <line x1="256" y1="256" x2="256" y2="145" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" />
  <line x1="256" y1="256" x2="340" y2="295" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" />
  <circle cx="256" cy="256" r="20" fill="#FFFFFF" />
</svg>
