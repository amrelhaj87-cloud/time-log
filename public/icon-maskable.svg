<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
  </defs>
  
  <!-- Full bleed background -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />
  
  <!-- Prominent, crisp bold white circle inside safe zone -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" />
  
  <!-- Bold white clock hands -->
  <line x1="256" y1="256" x2="256" y2="165" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" />
  <line x1="256" y1="256" x2="325" y2="290" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" />
  <circle cx="256" cy="256" r="18" fill="#FFFFFF" />
</svg>
