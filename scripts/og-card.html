<!-- Source of public/og-image.png (link-preview card). Regenerate: chrome --headless=new --window-size=1200,630 --screenshot=og-image.png scripts/og-card.html -->
<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:Cairo,sans-serif;background:linear-gradient(135deg,#F4F6FA 0%,#E9ECFB 100%);color:#141B2D;position:relative}
.wrap{position:absolute;inset:0;padding:70px 80px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:28px}
.top img{width:120px;height:120px;border-radius:30px;box-shadow:0 12px 30px rgba(79,70,229,.3)}
h1{margin:0;font-size:84px;font-weight:900;line-height:1.1}
h1 span{color:#4F46E5;font-size:54px;font-weight:800;margin-inline-start:14px}
.tag{font-size:46px;font-weight:800;margin:0;color:#141B2D}
.sub{font-size:30px;font-weight:600;color:#4A5568;margin:10px 0 0}
.hours{position:absolute;left:80px;bottom:70px;display:grid;grid-template-columns:repeat(6,46px);gap:10px;opacity:.95}
.hours i{display:block;width:46px;height:46px;border-radius:12px}
.chips{display:flex;gap:12px}
.chips b{font-size:24px;font-weight:800;padding:6px 18px;border-radius:999px;color:#fff}
</style></head><body>
<div class="wrap">
 <div class="top"><img src="../public/icon.svg"><h1>سجل الوقت<span>Time Log</span></h1></div>
 <div>
  <p class="tag">سجّل وقتك. اعرف حياتك.</p>
  <p class="sub">كل ساعة لها خانة · بومودورو · تقارير أسبوعية · مجاني ومفتوح المصدر</p>
 </div>
 <div class="chips"><b style="background:#059669">E</b><b style="background:#4F46E5">V</b><b style="background:#0284C7">R</b><b style="background:#E11D48">S</b><b style="background:#7C3AED">SC</b></div>
</div></body></html>
