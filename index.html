<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>سجل الوقت - Time Log</title>
    <meta name="description" content="تطبيق متكامل لتسجيل وتنظيم الوقت اليومي وتتبع الأولويات" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="mask-icon" href="/icon-maskable.svg" color="#4F46E5" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="application-name" content="سجل الوقت" />
    <meta name="apple-mobile-web-app-title" content="سجل الوقت" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Apply the saved dark mode + color theme before first paint (no flash).
      // React (useTheme) takes over after mount using the same localStorage keys.
      (function () {
        try {
          var root = document.documentElement;
          var mode = localStorage.getItem('themeMode');
          if (!mode) mode = localStorage.getItem('darkMode') === 'true' ? 'dark' : 'light';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) root.classList.add('dark');
          var palette = localStorage.getItem('themePalette');
          if (palette && palette !== 'classic') root.setAttribute('data-palette', palette);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
